# NAS100 (NQ index futures / CFD) configuration. Prices in index points; 1 "pip" = 1 point.
# Values marked CHECK depend on your broker's contract specification.
initial_equity = 10000.0

[instrument]
symbol = "NAS100"             # CHECK: broker symbol name
pip_size = 1.0
spread_pips = 0.5            # CHECK
contract_size = 1            # CHECK: $ per 1.0 point per lot on most CFD brokers
commission_per_lot = 0.0     # CHECK
quote_to_account_rate = 1.0
volume_step = 0.01
min_lots = 0.01
news_currencies = ["USD"]
asset_class = "index"

[strategy]
timeframe_minutes = 5
day_rollover = "17:00"
killzones = [
  { name = "ny_am", start = "09:50", end = "11:15" },
  { name = "ny_pm", start = "13:30", end = "16:00" },
]
reference_ranges = [
  { name = "asia",   start = "20:00", end = "00:00" },
  { name = "london", start = "02:00", end = "05:00" },
]
use_prior_day_levels = true
invalidate_levels_taken_outside_killzone = false
min_sweep_pips = 3.0
max_confirm_bars = 3
stop_buffer_pips = 5.0
min_stop_pips = 12.0
max_stop_pips = 180.0
target_mode = "opposite_level"
target_rr = 2.0
min_rr = 1.5
sd_targets = true
enforce_liquidity_purge_order = false
trim_stop_at_50_pct = true
move_be_at_75_pct = true
max_signals_per_day = 1
flatten_time = "16:00"

[risk]
risk_per_trade_pct = 0.5
max_daily_loss_pct = 2.0
max_weekly_loss_pct = 4.0
max_consecutive_losses = 3
max_trades_per_day = 2
max_open_positions = 1
max_lots = 50.0

[live]
magic = 20260905
journal_path = "journal_nas100.sqlite"
