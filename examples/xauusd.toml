# XAUUSD (gold) configuration. Values marked CHECK depend on your broker; read them from
# MT4/MT5 (right-click the symbol in Market Watch -> Specification).
# ICT Time-and-Price configuration. Every value below is a rule to confirm
# with the trader (see RULES.md). Times are New York local time.
initial_equity = 10000.0

[instrument]
symbol = "XAUUSD"            # CHECK: some brokers call it GOLD or XAUUSD.m
pip_size = 0.1               # 1 "pip" = $0.10 move in price; all *_pips values below use this
spread_pips = 3.0            # CHECK: typical XAUUSD spread is $0.20-$0.40
contract_size = 100          # CHECK: 1 lot = 100 oz at most brokers
commission_per_lot = 7.0     # CHECK
quote_to_account_rate = 1.0  # USD account
volume_step = 0.01
min_lots = 0.01
news_currencies = ["USD"]    # gold reacts to US news

[strategy]
timeframe_minutes = 5
day_rollover = "17:00"
killzones = [
  { name = "london",   start = "02:00", end = "05:00" },
  { name = "new_york", start = "07:00", end = "10:00" },
]
reference_ranges = [
  { name = "asia",   start = "20:00", end = "00:00" },
  { name = "london", start = "02:00", end = "05:00" },
]
use_prior_day_levels = true
invalidate_levels_taken_outside_killzone = false
min_sweep_pips = 5.0
max_confirm_bars = 3
stop_buffer_pips = 10.0
min_stop_pips = 20.0
max_stop_pips = 450.0
target_mode = "opposite_level"   # or "rr"
target_rr = 2.0
min_rr = 1.5
sd_targets = true

# Advanced ICT Parameters
require_fvg = false
fvg_in_premium_discount = false
enforce_liquidity_purge_order = false
trim_stop_at_50_pct = true
move_be_at_75_pct = true

max_signals_per_day = 1
flatten_time = "16:00"

[risk]
risk_per_trade_pct = 0.5
max_daily_loss_pct = 2.0
max_weekly_loss_pct = 4.0
max_consecutive_losses = 3
max_trades_per_day = 2
max_open_positions = 1
max_lots = 5.0

# Ep 41 Dynamic Risk Reduction
enable_dynamic_risk_reduction = false
loss_recovery_threshold_pct = 50.0

[news]
enabled = true
impacts = ["high"]
minutes_before = 30
minutes_after = 30
flatten_minutes_before = 5

[live]
platform = "mt5"            # or "mt4" (needs the ICTBridge EA, see README)
# bridge_dir = 'C:\Users\YOU\AppData\Roaming\MetaQuotes\Terminal\Common\Files'   # mt4 only
bridge_timeout_seconds = 15
server_timezone = "NY+7"
poll_seconds = 5
magic = 20260902
deviation_points = 10
max_signal_age_seconds = 120
kill_switch_file = "STOP"
journal_path = "journal_xauusd.sqlite"
